[project]
name = "qcc"
version = "0.1.0"
description = "A small optimizing quantum compiler: OpenQASM 3 → MLIR-style dialect (xDSL) → rewrite passes → QIR → CUDA-Q, benchmarked against Qiskit and pytket"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Drishan Sarkar" }]
requires-python = ">=3.12"
dependencies = [
    "xdsl",
    "openqasm3[parser]",
    "pyqir",
    "qiskit>=2.5.0",
    "pytket",
    "numpy",
    "matplotlib>=3.11.0",
    "cudaq>=0.15.0",
    "networkx>=3.6.1",
    "qdk>=1.31.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
qcc = "qcc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcc"]
