[project]
name = "qcc"
version = "0.1.0"
description = "A small optimizing quantum compiler: OpenQASM 3 → MLIR-style dialect (xDSL) → rewrite passes → QIR → CUDA-Q, benchmarked against Qiskit and pytket"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Drishan Sarkar" }]
requires-python = ">=3.12"
dependencies = [
    "xdsl>=0.68,<0.69",
    "openqasm3[parser]>=1.0,<2",
    "pyqir>=0.12,<0.13",
    "numpy>=2.3,<3",
]

[project.optional-dependencies]
cudaq = ["cudaq>=0.15,<0.16"]
bench = [
    "qiskit>=2.5,<3",
    "pytket>=2.18,<3",
    "matplotlib>=3.11,<4",
    "networkx>=3.6,<4",
    "qdk>=1.31,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "qiskit>=2.5,<3",
]

[project.scripts]
qcc = "qcc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcc"]
